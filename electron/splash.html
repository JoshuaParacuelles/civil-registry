<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Local Civil Register</title>
<style>
  :root {
    --primary: #1d6fe0;
    --primary-dark: #1557c0;
    --title: #1f2a44;
    --accent: #8a6a4a;
    --muted: #64748b;
    --track: #e5e7eb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: var(--title);
    user-select: none;
  }

  body {
    border: 1px solid #e5e7eb;
  }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 36px;
    animation: rise 0.4s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .org {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }

  .title {
    font-size: 19px;
    font-weight: 700;
    color: var(--title);
    text-align: center;
  }

  .underline {
    width: 44px;
    height: 3px;
    border-radius: 3px;
    background: var(--primary);
    margin-top: 2px;
  }

  /* Percentage ring */
  .ring {
    position: relative;
    width: 96px;
    height: 96px;
    margin-top: 10px;
    --p: 0;
  }
  .ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--primary) calc(var(--p) * 1%), var(--track) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  }

  .pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }

  .sub {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    text-align: center;
  }

  /* Progress bar */
  .bar {
    width: 100%;
    max-width: 260px;
    height: 4px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="org">City of San Carlos</div>
    <div class="title">Local Civil Registrar</div>
    <div class="underline"></div>

    <div class="ring" id="ring">
      <div class="pct" id="pct">0%</div>
    </div>

    <div class="sub" id="sub">Starting up…</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

<script>
  (function () {
    var shown = 0;
    var target = 0;
    var ring = document.getElementById('ring');
    var pctEl = document.getElementById('pct');
    var fill = document.getElementById('fill');
    var sub = document.getElementById('sub');

    // Called from main process. Progress never goes backwards.
    window.setProgress = function (value, text) {
      var v = Math.min(100, Math.max(0, Number(value) || 0));
      if (v > target) target = v;
      if (typeof text === 'string' && text !== sub.textContent) sub.textContent = text;
    };

    // Smooth easing toward the target value. Faster near the end.
    function tick() {
      var d = target - shown;
      var speed = target >= 100 ? 0.25 : 0.08;
      shown = Math.abs(d) < 0.05 ? target : shown + d * speed;
      pctEl.textContent = Math.round(shown) + '%';
      ring.style.setProperty('--p', shown.toFixed(2));
      fill.style.width = shown.toFixed(2) + '%';
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
</body>
</html>
